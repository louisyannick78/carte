<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yannick — Directeur Régional Nord-Est</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#010E3D; --navy2:#1C2953; --cyan:#7FB2F0; --cyan2:#0D52A0;
    --ink:#010E3D; --muted:#5B6478; --line:#E5E8EE; --card:#F7F8FB; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--navy)}
  body{font-family:Inter,Calibri,system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;
       display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:440px;min-height:100vh;background:var(--white);position:relative;overflow:hidden}

  /* ---------- HERO ---------- */
  .hero{position:relative;background:radial-gradient(120% 90% at 85% 0%,#1C2953 0%,#010E3D 60%);
        color:#fff;padding:30px 26px 128px;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;
        background-image:linear-gradient(rgba(127,178,240,.07) 1px,transparent 1px),
                         linear-gradient(90deg,rgba(127,178,240,.07) 1px,transparent 1px);
        background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0%,transparent 85%)}
  .ring{position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;
        border:1px solid rgba(127,178,240,.35);animation:pulse 4s ease-out infinite}
  .ring.r2{animation-delay:1.3s}.ring.r3{animation-delay:2.6s}
  @keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .eyebrow{position:relative;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;
        letter-spacing:.32em;text-transform:uppercase;color:var(--cyan)}
  .eyebrow::before{content:"";width:3px;height:16px;background:var(--cyan);border-radius:2px}
  .tap{position:relative;margin-top:6px;font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.02em}

  /* ---------- IDENTITY ---------- */
  .id{position:relative;margin:-58px 20px 0;background:#fff;border-radius:22px;padding:22px 22px 24px;
      box-shadow:0 18px 50px -18px rgba(11,23,51,.45),0 0 0 1px var(--line);text-align:center;
      animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .avatar{width:104px;height:104px;margin:-74px auto 14px;border-radius:50%;padding:4px;
      background:conic-gradient(from 210deg,#7FB2F0,#0D52A0,#1C2953,#7FB2F0);}
  .avatar>div{width:100%;height:100%;border-radius:50%;background:var(--navy) center/cover no-repeat;
      border:3px solid #fff;display:grid;place-items:center;color:#fff;font-size:38px;font-weight:800;letter-spacing:-.02em}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
  .role{margin-top:6px;font-size:15px;font-weight:600;color:var(--cyan2)}
  .org{margin-top:2px;font-size:13.5px;color:var(--muted)}
  .tagline{margin-top:14px;font-size:14px;font-style:italic;color:var(--muted);line-height:1.5}

  /* ---------- ACTIONS ---------- */
  .save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;
      padding:16px;border:0;border-radius:999px;cursor:pointer;font:700 16px Inter,system-ui,sans-serif;color:#fff;
      background:#0D52A0;box-shadow:0 10px 24px -10px rgba(13,82,160,.8);
      transition:transform .15s}
  .save:active{transform:scale(.98)}
  .save svg{width:20px;height:20px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .q{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;border-radius:14px;
      background:var(--card);text-decoration:none;color:var(--navy);font-size:11.5px;font-weight:600;
      border:1px solid var(--line);transition:background .15s,transform .15s}
  .q:active{transform:scale(.96);background:#EAF1FB}
  .q svg{width:22px;height:22px;stroke:var(--cyan2)}

  /* ---------- SECTIONS ---------- */
  section{padding:26px 22px 0}
  .h{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.3em;
      text-transform:uppercase;color:var(--cyan2);margin-bottom:12px}
  .h::before{content:"";width:3px;height:14px;background:var(--cyan);border-radius:2px}
  .row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border-radius:12px;
      border-left:3px solid var(--cyan);margin-bottom:8px}
  .row .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .row .v{font-size:15px;font-weight:600;color:var(--navy);word-break:break-word}
  .row .grow{flex:1;min-width:0}
  .copy{border:0;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
      font:600 12px Inter,system-ui,sans-serif;color:var(--cyan2);cursor:pointer}
  .brand{display:flex;align-items:center;justify-content:center;min-height:150px;padding:26px;border-radius:18px;
      background:radial-gradient(120% 120% at 80% 0%,#1C2953 0%,#010E3D 65%)}
  .brand img{height:96px;width:auto}
  .brand .word{font-size:30px;font-weight:800;color:#fff}
  .pillars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .p{background:var(--navy);color:#fff;border-radius:14px;padding:14px 10px;text-align:center}
  .p b{display:block;font-size:13px;margin-top:6px}
  .p span{font-size:11px;color:rgba(255,255,255,.6)}
  .p svg{width:24px;height:24px;stroke:var(--cyan)}

  /* ---------- QR ---------- */
  .qrbox{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;
      background:linear-gradient(135deg,#010E3D,#1C2953);color:#fff}
  #qr{background:#fff;padding:8px;border-radius:10px;flex:none;line-height:0}
  #qr img,#qr canvas{width:96px!important;height:96px!important}
  .qrbox p{font-size:13px;line-height:1.5;color:rgba(255,255,255,.8)}
  .qrbox strong{color:var(--cyan);display:block;font-size:14px;margin-bottom:4px}

  footer{margin-top:30px;padding:22px;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--muted)}
  footer .nfc{display:inline-flex;align-items:center;gap:6px;color:var(--cyan2);font-weight:600}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--navy);
      color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;transition:.25s;
      box-shadow:0 10px 30px -10px rgba(0,0,0,.5);z-index:9}
  .toast.on{transform:translate(-50%,0);opacity:1}
  .fade{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="eyebrow">Carte de visite</div>
    <div class="tap">Merci d'avoir approché votre téléphone 👋</div>
  </div>

  <div class="id">
    <div class="avatar"><div id="avatar"></div></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <div class="org" id="org"></div>
    <p class="tagline" id="tagline"></p>

    <button class="save" id="save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Enregistrer mon contact
    </button>

    <div class="quick">
      <a class="q" id="aCall"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Appeler</a>
      <a class="q" id="aSms"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>SMS</a>
      <a class="q" id="aMail"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>E-mail</a>
    </div>
  </div>

  <section class="fade" style="animation-delay:.15s">
    <div class="h">Coordonnées</div>
    <div class="row"><div class="grow"><div class="k">Mobile</div><div class="v" id="vPhone"></div></div><button class="copy" data-copy="phone">Copier</button></div>
    <div class="row"><div class="grow"><div class="k">E-mail</div><div class="v" id="vMail"></div></div><button class="copy" data-copy="email">Copier</button></div>
    <div class="row"><div class="grow"><div class="k">Secteur</div><div class="v" id="vZone"></div></div></div>
  </section>

  <section class="fade" style="animation-delay:.3s">
    <div class="brand" id="brand"></div>
  </section>

  <section class="fade" style="animation-delay:.45s">
    <div class="h">Partager cette carte</div>
    <div class="qrbox">
      <div id="qr"></div>
      <p><strong>Pas de NFC ?</strong>Scannez ce code avec l'appareil photo pour ouvrir cette carte.</p>
    </div>
  </section>

  <footer>
    <span class="nfc">◉ Carte NFC</span> · <span id="fYear"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>

  url:       ""                             // ← adresse publique de la carte (pour le QR code)
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const full = `${CARD.firstName} ${CARD.lastName}`;
const telRaw = "+33" + CARD.phone.replace(/\D/g,"").replace(/^0/,"");

$("name").textContent = full;
$("role").textContent = CARD.role;
$("org").textContent = CARD.org;
$("tagline").textContent = CARD.tagline;
$("vPhone").textContent = CARD.phone;
$("vMail").textContent = CARD.email;
$("vZone").textContent = CARD.zone;
$("fYear").textContent = `${full} · ${new Date().getFullYear()}`;
const br = $("brand");
if (CARD.logo) { const i=new Image(); i.src=CARD.logo; i.alt=CARD.org; br.appendChild(i); }
else { const w=document.createElement("span"); w.className="word"; w.textContent=CARD.org; br.appendChild(w); }
const av = $("avatar");
if (CARD.photo) av.style.backgroundImage = `url("${CARD.photo}")`;
else av.textContent = (CARD.firstName[0] + (CARD.lastName[0]||"")).toUpperCase();

$("aCall").href = `tel:${telRaw}`;
$("aSms").href  = `sms:${telRaw}`;
$("aMail").href = `mailto:${CARD.email}`;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }

document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
  const v = CARD[b.dataset.copy];
  try { await navigator.clipboard.writeText(v); toast("Copié ✓"); } catch(e){ toast(v); }
}));

/* ---------- vCard ---------- */
function vcard(){
  const lines = [
    "BEGIN:VCARD","VERSION:3.0",
    `N:${CARD.lastName};${CARD.firstName};;;`,
    `FN:${full}`,
    `ORG:${CARD.org}`,
    `TITLE:${CARD.role}`,
    `TEL;TYPE=CELL,VOICE:${telRaw}`,
    `EMAIL;TYPE=INTERNET,WORK:${CARD.email}`,
    `NOTE:${CARD.zone}`
  ];
  if (CARD.photo && CARD.photo.startsWith("data:image/jpeg;base64,"))
    lines.push("PHOTO;ENCODING=b;TYPE=JPEG:" + CARD.photo.split(",")[1]);
  lines.push("END:VCARD");
  return lines.join("\r\n");
}
const fname = `${CARD.firstName}-${CARD.lastName}.vcf`.replace(/\s+/g,"-");

let dl = null;
if (window.claude && claude.use) claude.use("downloads").then(d => dl = d).catch(()=>{});

$("save").addEventListener("click", async () => {
  const data = vcard();
  if (dl) {
    try { await dl.save({ filename: fname, data }); return; } catch(e){ /* viewer declined: fall through */ }
  }
  const blob = new Blob([data], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
});

/* ---------- QR ---------- */
const target = CARD.url || location.href;
try { new QRCode($("qr"), { text: target, width: 192, height: 192, colorDark: "#010E3D", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); }
catch(e){ $("qr").closest("section").style.display = "none"; }
</script>
